# pepe-doge-breakout-radar ｜ 本机自托管 Compose（见 docs/sop/docker.md）
# 运行目录 = 部署副本（Developer/coding/docker/pepe-doge-breakout-radar/），禁在本文件写真实密钥。
name: pepe-doge-breakout-radar

services:
  radar:
    build:
      context: .
      dockerfile: Dockerfile
    image: pepe-doge-breakout-radar:${IMAGE_TAG:-latest}
    container_name: pepe-doge-breakout-radar-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5001}:5000"
    env_file:
      - .env.local
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 5000
      COZE_PROJECT_ENV: PROD
    volumes:
      # SQLite 主库持久化（DockerData，bind mount；目录必须预先存在）
      - "${APP_DATA_DIR}:/app/data/db"
